[project]
name = "diagnostic-des-tumeurs"
version = "0.1.0"
description = "Classification de tumeurs cérébrales (IRM) avec TensorFlow/Keras."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "tensorflow>=2.15,<2.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pillow>=10.0",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
